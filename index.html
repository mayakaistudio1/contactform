<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Alexander</title>

  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      background: #f5f5f7;
      padding: 30px;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .wa {
      background: #25D366;
      color: #fff;
    }

    .tg {
      background: #229ED9;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Take the first step</h2>
    <p>Choose what you’re interested in and message Alexander directly.</p>

    <select id="interest">
      <option value="passive income">Passive income</option>
      <option value="building a team">Building a team</option>
      <option value="both passive income and a team">Both</option>
    </select>

    <button class="wa" onclick="openWhatsApp()">Write in WhatsApp</button>
    <button class="tg" onclick="openTelegram()">Write in Telegram</button>
  </div>

  <script>
    const telegramUsername = "jazgil";
    const whatsappNumber = "447380307222";

    function getMessage() {
      const interest = document.getElementById("interest").value;
      return encodeURIComponent(
        "Hi Alexander! I found your page and would like to learn more about EXFUSION. I’m interested in " + interest + "."
      );
    }

    function openWhatsApp() {
      const message = getMessage();
      window.open(
        "https://wa.me/" + whatsappNumber + "?text=" + message,
        "_blank"
      );
    }

    function openTelegram() {
      const message = getMessage();
      window.open(
        "https://t.me/" + telegramUsername + "?text=" + message,
        "_blank"
      );
    }
  </script>

</body>
</html>
